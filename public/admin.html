<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>约会回复</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --paper: #f6f1ec; --sheet: #fffdfb; --ink: #2a2330; --muted: #7a6e76;
    --rule: #e3d8d3; --rose: #c8325a; --rose-soft: #f8dde4; --fiber: #00a0a8;
    --serif: "Noto Serif SC", "Songti SC", serif;
    --sans: "Noto Sans SC", "PingFang SC", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 var(--sans); padding: 24px 16px 48px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font: 700 24px/1.3 var(--serif); margin: 0; }
  .count { font: 12px var(--mono); color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 3px; }
  .ghost { border: 1px solid var(--rule); background: var(--sheet); color: var(--muted); padding: 6px 12px; }
  .primary { border: 0; background: var(--rose); color: #fff; padding: 10px 20px; font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--fiber); outline-offset: 2px; }

  .login { max-width: 360px; margin: 12vh auto 0; background: var(--sheet); border: 1px solid var(--rule); padding: 28px 24px; display: grid; gap: 14px; }
  .login input { font: 15px var(--sans); padding: 10px 12px; border: 1px solid var(--rule); border-radius: 3px; width: 100%; }
  .err { color: var(--rose); font-size: 13px; min-height: 20px; margin: 0; }

  .list { display: grid; gap: 14px; }
  .card { background: var(--sheet); border: 1px solid var(--rule); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px dashed var(--rule); }
  .card-head .no { font: 600 13px var(--mono); }
  .card-head .when { font: 12px var(--mono); color: var(--muted); }
  .card-body { padding: 14px 18px 16px; display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; }
  .card-body dt { color: var(--muted); font-size: 13px; }
  .card-body dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .name { font: 700 18px/1.3 var(--serif); }
  .pill { display: inline-block; font: 12px var(--mono); padding: 1px 8px; border-radius: 99px; background: var(--rose-soft); color: var(--rose); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); background: var(--sheet); border: 1px dashed var(--rule); }
  @media (max-width: 460px) { .card-body { grid-template-columns: 1fr; gap: 2px; } .card-body dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login" hidden>
    <h1>约会回复后台</h1>
    <input type="password" id="password" placeholder="管理员密码" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="primary" type="submit">进入</button>
  </form>

  <section id="panel" hidden>
    <header>
      <div>
        <h1>收到的约会回复</h1>
        <span class="count" id="count"></span>
      </div>
      <div>
        <button class="ghost" id="refresh" type="button">刷新</button>
        <button class="ghost" id="logout" type="button">退出</button>
      </div>
    </header>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const fmt = (iso) => new Date(iso).toLocaleString("zh-CN", { hour12: false });

  async function load() {
    const r = await fetch("/api/admin/responses");
    if (r.status === 401) {
      $("panel").hidden = true;
      $("login").hidden = false;
      return;
    }
    const { rows } = await r.json();
    $("login").hidden = true;
    $("panel").hidden = false;
    $("count").textContent = `共 ${rows.length} 条`;
    const list = $("list");
    list.replaceChildren();
    if (!rows.length) {
      list.append(el("div", "empty", "还没有回复。把链接发出去吧：/?to=她的名字"));
      return;
    }
    for (const row of rows) {
      const card = el("article", "card");
      const head = el("div", "card-head");
      const left = el("div");
      left.append(el("span", "no", row.id), document.createTextNode("  "), el("span", "when", fmt(row.created_at)));
      const del = el("button", "ghost", "删除");
      del.type = "button";
      del.addEventListener("click", async () => {
        if (!confirm(`删除 ${row.nickname} 的回复？不可恢复。`)) return;
        await fetch(`/api/admin/responses/${encodeURIComponent(row.id)}`, { method: "DELETE" });
        load();
      });
      head.append(left, del);

      const body = el("dl", "card-body");
      const add = (k, v) => { if (v) body.append(el("dt", null, k), el("dd", null, v)); };
      body.append(el("dt", null, "称呼"));
      const dd = el("dd");
      dd.append(el("span", "name", row.nickname));
      if (row.to && row.to !== row.nickname) dd.append(document.createTextNode(`（链接名：${row.to}）`));
      body.append(dd);
      add("联系方式", row.contact);
      add("日期", [row.date, row.slot].filter(Boolean).join(" · "));
      add("想做", row.activities);
      add("忌口", row.diet);
      add("留言", row.message);
      body.append(el("dt", null, "点 No 次数"));
      const nd = el("dd");
      nd.append(el("span", "pill", row.no_clicks ? `躲了 ${row.no_clicks} 次才点 Yes` : "直接点了 Yes"));
      body.append(nd);

      card.append(head, body);
      list.append(card);
    }
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value }),
    });
    if (!r.ok) {
      $("loginErr").textContent = (await r.json()).error;
      return;
    }
    $("password").value = "";
    load();
  });
  $("refresh").addEventListener("click", load);
  $("logout").addEventListener("click", async () => {
    await fetch("/api/admin/logout", { method: "POST" });
    load();
  });
  load();
})();
</script>
</body>
</html>
